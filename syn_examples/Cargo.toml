[package]
name = "syn_examples"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0.110", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
anyhow = "1.0"
prettyplease = "0.2.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.3"
